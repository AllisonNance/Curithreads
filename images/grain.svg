<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Retro print grain. Tiles seamlessly (stitchTiles).
       baseFrequency = grain size (higher = finer)
       alpha row in feColorMatrix = speckle contrast
       rect opacity = overall strength -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <!-- Tint to scale-orange-900 (#6A3800); alpha from noise, pushed for crisp speckle -->
    <feColorMatrix type="matrix" values="0 0 0 0 0.416
                                         0 0 0 0 0.22
                                         0 0 0 0 0
                                         3 0 0 0 -1.2"/>
  </filter>
  <rect width="200" height="200" filter="url(#grain)" opacity="0.35"/>
</svg>
